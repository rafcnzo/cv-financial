name: Encrypted database backup
on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'
permissions:
  contents: read
jobs:
  backup:
    if: vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y age postgresql-client
      - run: bash scripts/backup.sh
