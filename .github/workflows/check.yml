name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cv_owner
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: cv_financial
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cv_owner:local-only@localhost:5432/cv_financial
      TEST_DATABASE_URL: postgres://cv_owner:local-only@localhost:5432/cv_financial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:migrate
      - run: npm test
      - run: npm run dry-run -w @cv/api
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x apps/android/gradlew && cd apps/android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kangcatat-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 3
